<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ingresar — Organizador de asistencia</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="card">
    <h1>Organizador de asistencia</h1>

    <div class="tabs">
      <button id="tab-login" class="activo" type="button">Iniciar sesión</button>
      <button id="tab-registro" type="button">Registrarse</button>
    </div>

    <div id="mensaje" class="mensaje"></div>

    <!-- Formulario de login -->
    <form id="form-login">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required />

      <label for="login-contrasena">Contraseña</label>
      <input type="password" id="login-contrasena" required />

      <div class="enlace-secundario" style="text-align:right; margin:0;">
        <a id="link-olvide">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit">Ingresar</button>
    </form>

    <!-- Formulario de registro -->
    <form id="form-registro" class="oculto">
      <label for="reg-nombre">Nombre</label>
      <input type="text" id="reg-nombre" required />

      <label for="reg-apellido">Apellido</label>
      <input type="text" id="reg-apellido" required />

      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" required />

      <label for="reg-contrasena">Contraseña</label>
      <input
        type="password"
        id="reg-contrasena"
        required
        minlength="8"
        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}"
        title="Mínimo 8 caracteres, con al menos 1 mayúscula, 1 minúscula, 1 número y 1 carácter especial"
      />
      <span style="font-size:0.72rem; color:#5f6368; margin-top:-0.4rem;">
        Mínimo 8 caracteres: 1 mayúscula, 1 minúscula, 1 número y 1 carácter especial.
      </span>

      <button type="submit">Crear cuenta</button>
    </form>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
